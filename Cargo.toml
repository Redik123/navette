[package]
name = "navette"
version = "0.1.0"
edition = "2024"
description = "Suivi en direct de la navette du Ragnarok Festival"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = "0.4"
form_urlencoded = "1"
futures-util = "0.3"
# rustls + certificats embarqués : pas d'OpenSSL ni de ca-certificates dans l'image.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde ={ version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
