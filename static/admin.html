<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="robots" content="noindex">
  <title>Navette · Orga</title>
  <link rel="stylesheet" href="/crew.css">
  <style>
    :root {
      --bg: #0a0a0a; --surface: #121016; --surface-2: #1c1923; --line: #2a2533; --text: #f1f5f9; --muted: #a39cb0;
      --violet: #a78bfa; --orange: #ff7a1a; --green: #4ade80; --amber: #fbbf24; --red: #f87171;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0 auto; max-width: 640px; padding: 20px 16px 40px;
      background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    /* Trois tailles seulement : 12 (étiquettes, notes), 15 (texte), 20 (valeurs). */
    h1 { margin: 0; font-size: 15px; letter-spacing: .2em; text-transform: uppercase; color: var(--violet); }
    h2 { margin: 28px 0 10px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    a { color: var(--violet); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    .card { padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
    .card dt { color: var(--muted); font-size: 12px; }
    .card dd { margin: 2px 0 0; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .ok { color: var(--green); } .warn { color: var(--amber); } .err { color: var(--red); }
    button, input { font: inherit; color: inherit; }
    button {
      min-height: 44px; padding: 8px 16px; border-radius: 12px; border: 1px solid var(--line);
      background: var(--surface); font-weight: 700; cursor: pointer;
    }
    button.primary { background: var(--orange); color: #1b0c00; border-color: var(--orange); }
    input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
    .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .row > * { flex: 1; }
    .ext { display: inline-flex; align-items: center; gap: 4px; }
    .ext svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .note { color: var(--muted); font-size: 12px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>Navette · Orga</h1>
    <a class="ext" href="/" target="_blank" rel="noopener">Page publique
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>
  </header>

  <form id="login" hidden>
    <h2>Connexion</h2>
    <input id="token" type="password" autocomplete="off" placeholder="Jeton admin" required>
    <div class="row"><button type="submit" class="primary">Entrer</button></div>
  </form>

  <main id="panel" hidden>
    <h2>En direct</h2>
    <dl class="grid">
      <div class="card"><dt>Statut public</dt><dd id="s-status">—</dd></div>
      <div class="card"><dt>Dernière position</dt><dd id="s-age">—</dd></div>
      <div class="card"><dt>Batterie téléphone</dt><dd id="s-batt">—</dd></div>
      <div class="card"><dt>Précision GPS</dt><dd id="s-acc">—</dd></div>
      <div class="card"><dt>Vitesse</dt><dd id="s-speed">—</dd></div>
      <div class="card"><dt>Spectateurs connectés</dt><dd id="s-viewers">—</dd></div>
    </dl>
    <p class="note" id="s-next"></p>

    <h2>Navette</h2>
    <div id="crew"></div>

    <div class="row" style="margin-top:32px"><button type="button" id="logout">Se déconnecter</button></div>
  </main>

  <script src="/crew.js"></script>
  <script>
    'use strict';
    const $ = (id) => document.getElementById(id);
    const KEY = 'navette-admin-token';
    const LABELS = {
      moving: ['En route', 'ok'], at_stop: ['À quai, en attente', 'ok'], departing: ['Départ', 'ok'],
      stale: ['Signal perdu', 'warn'], offline: ['Hors ligne', 'err'], pause: ['Pause', 'warn'], off: ['Hors service', 'warn'],
    };
    let token = localStorage.getItem(KEY);
    let crew = null;

    // Les commandes de l'équipage interrogent le serveur toutes les 3 s ;
    // le reste de la page se met à jour avec le même état.
    function show() {
      $('login').hidden = !!token;
      $('panel').hidden = !token;
      if (token && !crew) {
        crew = mountCrew($('crew'), { getToken: () => token, onState: render, onUnauthorized: logout });
      } else if (!token && crew) {
        crew.stop();
        crew = null;
      }
    }

    function logout() {
      localStorage.removeItem(KEY);
      token = null;
      show();
    }

    function set(id, text, cls = '') {
      $(id).textContent = text;
      $(id).className = cls;
    }

    function render(data) {
      if (!data) {
        set('s-status', 'Serveur injoignable', 'err');
        return;
      }
      const snap = data.snapshot;
      const [label, cls] = LABELS[snap.status] || [snap.status, ''];
      set('s-status', label, cls);
      set('s-viewers', String(data.viewers));

      const fix = data.last_fix;
      if (fix) {
        const age = Math.round((snap.server_time - fix.ts) / 1000);
        set('s-age', age < 60 ? `${age} s` : `${Math.floor(age / 60)} min`, age > 90 ? 'err' : age > 20 ? 'warn' : 'ok');
        set('s-batt', fix.battery != null ? `${Math.round(fix.battery)} %` : '—', fix.battery != null && fix.battery < 25 ? 'err' : '');
        set('s-acc', fix.accuracy != null ? `${Math.round(fix.accuracy)} m` : '—');
        set('s-speed', fix.speed != null ? `${Math.round(fix.speed * 3.6)} km/h` : '—');
      } else {
        set('s-age', 'jamais', 'err');
      }

      const next = snap.etas.find((e) => e.stop === snap.next_stop);
      $('s-next').textContent = snap.bus && !snap.bus.on_route
        ? 'Attention : la navette est hors du tracé.'
        : next ? `Prochain arrêt : ${next.name} dans ~${Math.max(1, Math.round(next.eta_s / 60))} min.` : '';
    }

    $('login').addEventListener('submit', (e) => {
      e.preventDefault();
      token = $('token').value.trim();
      localStorage.setItem(KEY, token);
      show();
    });

    $('logout').addEventListener('click', logout);

    show();
  </script>
</body>
</html>
